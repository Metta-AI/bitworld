name: Private decision trajectories

on:
  push:
    branches: [master]
    paths: [src/bitworld/decision_trajectory.nim, src/bitworld/runtime.nim, src/bitworld/native_http.nim, src/bitworld/native_stop.nim, src/bitworld/artifact_runtime.nim, tests/test_artifact_http.py, tests/support/artifact_http_probe.nim, tests/test_native_https.py, tests/support/native_https_probe.nim, tests/test_decision_trajectory.nim, tests/test_native_http.py, tests/support/native_http_probe.nim, .github/workflows/decision-trajectories.yml]
  pull_request:
    paths: [src/bitworld/decision_trajectory.nim, src/bitworld/runtime.nim, src/bitworld/native_http.nim, src/bitworld/native_stop.nim, src/bitworld/artifact_runtime.nim, tests/test_artifact_http.py, tests/support/artifact_http_probe.nim, tests/test_native_https.py, tests/support/native_https_probe.nim, tests/test_decision_trajectory.nim, tests/test_native_http.py, tests/support/native_http_probe.nim, .github/workflows/decision-trajectories.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Nim dependencies
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/nimby" https://github.com/treeform/nimby/releases/download/0.1.26/nimby-Linux-X64
          chmod +x "$HOME/.local/bin/nimby"
          "$HOME/.local/bin/nimby" use 2.2.4
          "$HOME/.local/bin/nimby" --global sync nimby.lock
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          for pkg in "$HOME"/.nimby/pkgs/*; do
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
      - name: Install native HTTP development headers
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Verify private complete-episode and attribution contracts
        run: nim c -r --path:src -o:/tmp/test-decision-trajectory tests/test_decision_trajectory.nim
      - name: Verify owned native HTTP deadlines, partial bytes, and signal interruption
        run: |
          nim c -d:release --threads:on --mm:orc --path:src -o:/tmp/native-http-probe tests/support/native_http_probe.nim
          python3 tests/test_native_http.py /tmp/native-http-probe
      - name: Verify bounded private artifact finalization after inference interruption
        run: |
          nim c -d:release --threads:on --mm:orc --path:src -o:/tmp/artifact-http-probe tests/support/artifact_http_probe.nim
          python3 tests/test_artifact_http.py /tmp/artifact-http-probe
      - name: Verify configured HTTPS trust and hostname validation
        run: |
          nim c -d:release --threads:on --mm:orc --path:src -o:/tmp/native-https-probe tests/support/native_https_probe.nim
          python3 tests/test_native_https.py /tmp/native-https-probe
